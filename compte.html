<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ton compte — WODly</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:#FCF6EA;color:#18181B;line-height:1.6;min-height:100vh;}
  nav{background:rgba(255,255,255,.95);border-bottom:1px solid #E8E4DE;padding:0 24px;height:60px;display:flex;align-items:center;gap:10px;}
  nav a{font-size:.85rem;color:#FF6B35;font-weight:700;text-decoration:none;}
  nav span{color:#B0AAA2;font-size:.85rem;}
  main{max-width:440px;margin:0 auto;padding:56px 24px 80px;}
  h1{font-size:1.8rem;font-weight:900;letter-spacing:-1px;margin-bottom:8px;}
  .sous{color:#5A5349;font-size:.9rem;margin-bottom:32px;}
  label{display:block;font-size:.62rem;font-weight:700;color:#656C79;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
  input{width:100%;padding:15px 16px;background:#fff;border:1.5px solid #E8E4DE;border-radius:12px;
        font-family:inherit;font-size:1rem;font-weight:600;color:#18181B;outline:none;margin-bottom:16px;}
  input:focus{border-color:#FF6B35;}
  button{width:100%;padding:16px;border-radius:14px;background:#3B6099;border:none;color:#fff;
         font-family:inherit;font-size:.95rem;font-weight:800;cursor:pointer;box-shadow:0 8px 22px rgba(59,96,153,.26);}
  button:disabled{background:#EFEAE1;color:#A8A29A;cursor:default;box-shadow:none;}
  .msg{padding:12px 14px;border-radius:12px;font-size:.85rem;font-weight:600;margin-bottom:16px;line-height:1.5;}
  .err{background:#FEF2F2;border:1px solid #FCA5A5;color:#B3261E;}
  .ok{background:#ECFDF5;border:1px solid #6EE7B7;color:#065F46;}
  .aide{font-size:.78rem;color:#8A8175;margin-top:18px;line-height:1.6;}
  footer{text-align:center;padding:32px 24px;font-size:.78rem;color:#B0AAA2;}
</style>
</head>
<body>
<nav><a href="index.html">← WODly</a><span>/</span><span>Ton compte</span></nav>
<main>
  <h1 id="titre">Un instant…</h1>
  <div class="sous" id="sous">On vérifie ton lien.</div>
  <div id="message"></div>
  <form id="form" style="display:none">
    <label for="mdp">Nouveau mot de passe</label>
    <input id="mdp" type="password" autocomplete="new-password" placeholder="Au moins 6 caractères"/>
    <label for="mdp2">Confirme-le</label>
    <input id="mdp2" type="password" autocomplete="new-password" placeholder="Le même, une seconde fois"/>
    <button type="submit" id="valider">Enregistrer</button>
  </form>
  <div class="aide" id="aide">Ce lien n'est valable qu'une heure. Passé ce délai, redemande-en un depuis l'application.</div>
</main>
<footer>WODly</footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://pfbebvvbkcskmprvlluo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmYmVidnZia2Nza21wcnZsbHVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MTkzODEsImV4cCI6MjA5NjE5NTM4MX0.dB43W1_ayBWvh5t25cAUWK_O7-dW0j3cCVRJpMfzk58';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ detectSessionInUrl:true, flowType:'implicit' } });

const $ = id => document.getElementById(id);
const dire = (texte, classe='err') => { $('message').innerHTML = '<div class="msg '+classe+'">'+texte+'</div>'; };

/* Une seule page pour TOUS les liens d'e-mail (2026-09-15).

   Le « Site URL » de Supabase est la destination par défaut de TOUS les
   messages : réinitialisation, confirmation d'inscription, changement
   d'adresse. Une page dédiée au mot de passe aurait donc réclamé un mot de
   passe à quelqu'un qui venait simplement confirmer son adresse.

   Supabase place le type d'opération dans le FRAGMENT de l'URL, à côté du
   jeton (#access_token=...&type=recovery). On s'en sert pour décider quoi
   montrer. Le fragment ne part jamais au serveur : le jeton reste dans le
   navigateur. */
const frag = new URLSearchParams(location.hash.slice(1));
const type = frag.get('type') || '';

const ECRANS = {
  recovery:     { titre:'Un nouveau mot de passe', sous:"Choisis-en un nouveau, puis reconnecte-toi dans l'application.", form:true },
  signup:       { titre:'Ton adresse est confirm\u00e9e', sous:"Ton compte est ouvert. Retourne dans WODly et connecte-toi \u2014 tout t'attend.", form:false },
  email_change: { titre:'Ta nouvelle adresse est active', sous:"C'est d\u00e9sormais elle qui sert \u00e0 te connecter. Retourne dans WODly.", form:false },
  invite:       { titre:'Bienvenue chez WODly', sous:'Choisis ton mot de passe pour ouvrir ton compte.', form:true },
};

const poser = (e) => {
  $('titre').textContent = e.titre;
  $('sous').textContent  = e.sous;
  $('form').style.display = e.form ? 'block' : 'none';
  $('aide').style.display = e.form ? 'block' : 'none';
};

if (frag.get('error_description')) {
  poser({titre:'Ce lien n\'est plus valable', sous:'', form:false});
  dire("Il a expir\u00e9 ou a d\u00e9j\u00e0 servi. Redemande-en un depuis l'application.");
} else {
  const attendre = async (essais=6) => {
    for (let i=0;i<essais;i++){
      const { data } = await sb.auth.getSession();
      if (data?.session) return true;
      await new Promise(r=>setTimeout(r,300));
    }
    return false;
  };
  const ok = await attendre();
  if (!ok) {
    poser({titre:'Lien introuvable', sous:'', form:false});
    dire("Ouvre cette page depuis le lien re\u00e7u par e-mail. S'il a plus d'une heure, redemande-en un depuis l'application.");
  } else {
    poser(ECRANS[type] || ECRANS.recovery);
    if (!ECRANS[type]) {
      // type absent : on ne devine pas, on propose le cas le plus courant
      console.warn('type inconnu dans le fragment :', type);
    }
  }
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const a = $('mdp').value, b = $('mdp2').value;
  if (a.length < 6) { dire('Ton mot de passe doit faire au moins 6 caract\u00e8res.'); return; }
  if (a !== b)      { dire('Les deux mots de passe ne sont pas identiques.'); return; }
  $('valider').disabled = true; $('valider').textContent = 'Enregistrement\u2026';
  const { error } = await sb.auth.updateUser({ password: a });
  if (error) {
    dire("Impossible d'enregistrer : " + error.message);
    $('valider').disabled = false; $('valider').textContent = 'Enregistrer';
    return;
  }
  $('form').style.display = 'none'; $('aide').style.display = 'none';
  dire("C'est fait. Retourne dans WODly et connecte-toi avec ton nouveau mot de passe.", 'ok');
});
</script>
</body>
</html>
